<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ post.title }}</title>
  <style>
    body {
      background-color: #333333;
      margin: 0;
      padding: 0;
      color: #ddd;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    header {
      width: 60%;
      max-width: 600px;
      align-self: center;
      box-sizing: border-box;
      display: flex;
      justify-content: flex-start;
      margin: 20px auto;
    }
    a {
      text-align: center;
      margin: 0;
      color: #ddd;
      background-color: #673AB7;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 12px;
      border: none;
      cursor: pointer;
      width: fit-content;
    }
    a:hover {
      background-color: #aa82f1;
    }
    section {
      width: 60%;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #222;
      border-radius: 8px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      padding: 24px 0;
      text-align: left;
      color: #aa82f1;
      font-weight: 700;
    }

    div {
      display: flex;
      justify-content: center;
      flex-direction: column;
      width: 60%;
      max-width: 600px;
      margin: 20px auto;
    }
    details {
      margin: 24px auto;
      text-align: center;
      padding: 20px;
      border: 1px solid #000;
      width: 100%;
      max-width: 600px;
      align-self: center;
      box-sizing: border-box;
    }
    summary {
      width: fit-content;
      margin: 0 auto;
      background: #3F51B5;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 80%;
      margin: 20px auto 0;
    }
    input, textarea {
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      background: #eee;
    }
    button {
      margin: 0 auto;
      background: #673AB7;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      border: none;
      color: #ddd;
      width: 100%;
    }
    #delete-btn {
      background-color: transparent;
      color:#aa82f1;
      width: fit-content;
    }

  </style>
</head>
<body>
  <header>
    <a href="/">Regresar a la lista</a>
  </header>

  <section>
    <h1>{{ post.title }}</h1>
    <p>{{ post.body }}</p>
    <small id="post-id" style="display: none;">{{ post.id }}</small>
  </section>

  <div>
    <details>
      <summary>Actualizar post</summary>
      <form id="update-form">
        <input type="text" name="title" placeholder="Título" id="update-title" value="{{ post.title }}" required>
        <textarea name="body" placeholder="Cuerpo" id="update-body" rows="5" required>{{ post.body }}</textarea>
        <button type="button" id="update-btn">Actualizar</button>
      </form>
    </details>

    <button type="button" id="delete-btn">Eliminar</button>
  </div>

  <script>
    const postId = document.getElementById('post-id').textContent;
    const deleteBtn = document.getElementById('delete-btn');
    const updateBtn = document.getElementById('update-btn');

    deleteBtn.addEventListener('click', async () => {
      if (window.confirm("¿Estás seguro de borrar el post?")) {
        const res = await fetch(`/delete/${postId}`, {
          method: 'DELETE',
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          alert('Error al eliminar el post');
        }
      }
    });

    updateBtn.addEventListener('click', async () => {
      const res = await fetch(`/update/${postId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: document.getElementById('update-title').value,
          body: document.getElementById('update-body').value,
        }),
      });
      if (res.ok) {
        window.location.href = '/';
      } else {
        alert('Error al actualizar el post');
      }
    });
  </script>
</body>
</html>
