<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Mi blog en Rust</h1>
  <ul>
    {% for post in posts %}
    <li>
      <h3>{{ post.title }}</h3>
      <p>{{ post.body | truncate(length=150, killwords=true) }}</p>
      <a href="/post/{{ post.slug }}">Leer más</a>
    </li>
    {% endfor %}
  </ul>
  
</body>
</html>
