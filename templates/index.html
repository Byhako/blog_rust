<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      background-color: #333333;
      margin: 0;
      padding: 0;
      color: #ddd;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    h1 {
      margin: 0;
      padding: 24px 0;
      text-align: center;
      color: #aa82f1;
      font-weight: 700;
    }
    details {
      margin: 24px auto;
      text-align: center;
      padding: 20px;
      border: 1px solid #000;
      width: 60%;
      max-width: 600px;
      align-self: center;
      box-sizing: border-box;
    }
    summary {
      width: fit-content;
      margin: 0 auto;
      background: #3F51B5;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 80%;
      margin: 20px auto 0;
    }
    input, textarea {
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      background: #eee;
    }
    button {
      margin: 0 auto;
      background: #673AB7;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      border: none;
      color: #ddd;
      width: 100%;
    }
    ul {
      background: #222;
      margin: 20px auto;
      width: 60%;
      max-width: 600px;
      padding: 20px 40px;
      border-radius: 4px;
      box-sizing: border-box;
    }
    li {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
    }
    li:last-child {
      border-bottom: none;
    }
    h3 {
      margin: 0;
      color: #aa82f1;
    }
    a {
      color: #ddd;
      font-style: italic;
      text-decoration: none;
      font-size: 12px;
    }
    a:hover {
      text-decoration: underline;
      color: #aa82f1;
    }
  </style>
</head>
<body>
  <h1>Mi blog en Rust</h1>
  <details>
    <summary>Crear nuevo post</summary>
    <form id="post-form">
      <input type="text" name="title" placeholder="Título" id="title" required>
      <textarea name="body" placeholder="Cuerpo" id="body" rows="5" required></textarea>
      <button type="submit">Crear post</button>
    </form>
  </details>
  <ul>
    {% for post in posts %}
    <li>
      <h3>{{ post.title }}</h3>
      <p>{{ post.body | truncate(length=50, killwords=true) }}</p>
      <small id="post-id" style="display: none;">{{ post.id }}</small>
      <a href="/post/{{ post.slug }}">Leer más</a>
    </li>
    {% endfor %}
  </ul>


  <script>
    document.getElementById('post-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const body = document.getElementById('body').value;

      const res = await fetch('/new-post', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, body })
      });

      if (res.ok) {
        window.location.reload();
      } else {
        alert('Error al crear el post');
      }
    });
  </script>
</body>
</html>
